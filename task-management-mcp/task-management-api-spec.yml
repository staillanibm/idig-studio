openapi: 3.1.0
info:
  title: Task Management API
  description: Task management API
  version: 1.0.0
paths:
  /tasks:
    get:
      tags:
        - Tasks
      summary: List all tasks
      description: Retrieves a list of tasks with optional filtering and pagination.
        Filter by `assignee` email and/or `status`, and control pagination with
        `pageSize` and `offset`. Returns an object with the matching tasks under
        the `tasks` property.
      operationId: listTasks
      parameters:
        - name: assignee
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter tasks by assignee email address.
            title: Assignee
          description: Filter tasks by assignee email address.
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: "#/components/schemas/TaskStatus"
              - type: "null"
            description: Filter tasks by their current workflow status.
            title: Status
          description: Filter tasks by their current workflow status.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Number of tasks to return per page (max 100).
            default: 20
            title: Pagesize
          description: Number of tasks to return per page (max 100).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            description: Number of tasks to skip before returning results.
            default: 0
            title: Offset
          description: Number of tasks to skip before returning results.
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          description: Bad request - invalid input or query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Tasks
      summary: Create a new task
      description: Creates a new task. `description` is required; all other fields are
        optional. The task `id`, `createdAt`, and `updatedAt` are generated by
        the server. Returns the created task.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: Bad request - invalid input or query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{taskId}:
    get:
      tags:
        - Tasks
      summary: Get a task by ID
      description: Retrieves a single task by its unique identifier (UUID). Returns
        the complete task object including all fields and timestamps.
      operationId: getTaskById
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Taskid
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: Bad request - invalid input or query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Tasks
      summary: Update a task
      description: Updates an existing task. All fields are optional; only the fields
        provided are modified. `id`, `creator`, `createdAt`, and `updatedAt`
        cannot be modified. Returns the updated task.
      operationId: updateTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Taskid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: Bad request - invalid input or query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Tasks
      summary: Delete a task
      description: Permanently deletes a task by its unique identifier (UUID). This
        operation cannot be undone and returns no content on success.
      operationId: deleteTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Taskid
      responses:
        "204":
          description: Successful Response
        "400":
          description: Bad request - invalid input or query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      properties:
        errorId:
          type: string
          format: uuid
          title: Errorid
          description: Unique identifier for this specific error occurrence.
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Timestamp (ISO 8601, UTC) when the error occurred.
        code:
          type: string
          title: Code
          description: "Machine-readable error code. Common values: VALIDATION_ERROR,
            NOT_FOUND, INVALID_UUID, INVALID_PARAMETER, INTERNAL_ERROR."
        message:
          type: string
          title: Message
          description: Human-readable description of what went wrong.
      type: object
      required:
        - errorId
        - timestamp
        - code
        - message
      title: ErrorResponse
      description: Standard error response returned for all error scenarios.
    TaskCreate:
      properties:
        creator:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
          title: Creator
          description: Email address of the person who created the task.
          example: john.doe@example.com
        assignee:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
          title: Assignee
          description: Email address of the person assigned to work on this task.
          example: jane.smith@example.com
        status:
          $ref: "#/components/schemas/TaskStatus"
          description: >-
            Current workflow status of the task, representing its position in
            the workflow lifecycle:

            - todo: planned but not yet started

            - inprogress: actively being worked on

            - blocked: cannot proceed due to dependencies or issues

            - done: completed successfully

            - cancelled: cancelled and will not be completed Defaults to 'todo'.
          default: todo
        targetDate:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Targetdate
          description: Target completion date and time in ISO 8601 format (UTC). Soft
            deadline.
          example: 2026-06-30T17:00:00Z
        description:
          type: string
          maxLength: 5000
          minLength: 1
          title: Description
          description: Detailed description of what needs to be done.
          example: Implement new feature X
        comment:
          anyOf:
            - type: string
              maxLength: 5000
            - type: "null"
          title: Comment
          description: Additional notes, comments, or context about the task.
          example: High priority - needed for next release
      type: object
      required:
        - description
      title: TaskCreate
      description: |-
        Fields accepted when creating a new task. `id` and timestamps are
        generated by the server and must not be provided.
    TaskListResponse:
      properties:
        tasks:
          items:
            $ref: "#/components/schemas/TaskResponse"
          type: array
          title: Tasks
          description: The list of tasks matching the query.
      type: object
      required:
        - tasks
      title: TaskListResponse
      description: Container object wrapping the list of tasks returned by the list
        endpoint.
    TaskResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Unique identifier (UUID v4) for the task. Immutable.
        creator:
          anyOf:
            - type: string
            - type: "null"
          title: Creator
          description: Email address of the person who created the task.
        assignee:
          anyOf:
            - type: string
            - type: "null"
          title: Assignee
          description: Email address of the person assigned to work on this task.
        status:
          $ref: "#/components/schemas/TaskStatus"
          description: >-
            Current workflow status of the task, representing its position in
            the workflow lifecycle:

            - todo: planned but not yet started

            - inprogress: actively being worked on

            - blocked: cannot proceed due to dependencies or issues

            - done: completed successfully

            - cancelled: cancelled and will not be completed
        targetDate:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Targetdate
          description: Target completion date and time in ISO 8601 format (UTC). Soft
            deadline.
        description:
          type: string
          title: Description
          description: Detailed description of what needs to be done.
        comment:
          anyOf:
            - type: string
            - type: "null"
          title: Comment
          description: Additional notes, comments, or context about the task.
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: Timestamp (ISO 8601, UTC) when the task was created. Immutable.
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: Timestamp (ISO 8601, UTC) when the task was last updated.
      type: object
      required:
        - id
        - status
        - description
        - createdAt
        - updatedAt
      title: TaskResponse
      description: Complete task object with all fields including server-generated metadata.
    TaskStatus:
      type: string
      enum:
        - todo
        - inprogress
        - blocked
        - done
        - cancelled
      title: TaskStatus
    TaskUpdate:
      properties:
        creator:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
          title: Creator
          description: Email address of the person who created the task.
        assignee:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
          title: Assignee
          description: Email address of the person assigned to work on this task.
        status:
          anyOf:
            - $ref: "#/components/schemas/TaskStatus"
            - type: "null"
          description: >-
            Current workflow status of the task, representing its position in
            the workflow lifecycle:

            - todo: planned but not yet started

            - inprogress: actively being worked on

            - blocked: cannot proceed due to dependencies or issues

            - done: completed successfully

            - cancelled: cancelled and will not be completed
        targetDate:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Targetdate
          description: Target completion date and time in ISO 8601 format (UTC). Soft
            deadline.
        description:
          anyOf:
            - type: string
              maxLength: 5000
              minLength: 1
            - type: "null"
          title: Description
          description: Detailed description of what needs to be done.
        comment:
          anyOf:
            - type: string
              maxLength: 5000
            - type: "null"
          title: Comment
          description: Additional notes, comments, or context about the task.
      type: object
      title: TaskUpdate
      description: >-
        Fields accepted when updating a task. All fields are optional; only the

        fields provided are modified. `id`, `creator`, and timestamps are
        immutable.
tags:
  - name: Tasks
    description: Operations related to task management. Tasks represent work items
      that can be assigned, tracked, and managed through various workflow
      states.
