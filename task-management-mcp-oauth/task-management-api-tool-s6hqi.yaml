kind: MCPTools
apiVersion: api.ibm.com/v1
metadata:
  name: task-management-api-tool-s6hqi
  namespace: task-management-mcp-oauth
  version: "1.0"
  tags: []
  description: Task management API
  domain: mcp
  labels:
    api-spec: ./task-management-api-spec.yml
spec:
  tools:
    - name: listTasks
      description: Retrieves a list of tasks with optional filtering and pagination.
        Filter by `assignee` email and/or `status`, and control pagination with
        `pageSize` and `offset`. Returns an object with the matching tasks under
        the `tasks` property.
      inputSchema:
        type: object
        properties:
          assignee:
            description: Filter tasks by assignee email address.
            x-parameter-location: query
            anyOf:
              - type: string
              - type: "null"
            title: Assignee
          status:
            description: Filter tasks by their current workflow status.
            x-parameter-location: query
            anyOf:
              - &a1
                type: string
                enum:
                  - todo
                  - inprogress
                  - blocked
                  - done
                  - cancelled
                title: TaskStatus
              - type: "null"
            title: Status
          pageSize:
            description: Number of tasks to return per page (max 100).
            x-parameter-location: query
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Pagesize
          offset:
            description: Number of tasks to skip before returning results.
            x-parameter-location: query
            type: integer
            minimum: 0
            default: 0
            title: Offset
      title: List all tasks
      x-api-binding:
        operationPath: /tasks
        operationMethod: GET
        api:
          $path: ./task-management-api-spec.yml
    - name: createTask
      description: Creates a new task. `description` is required; all other fields are
        optional. The task `id`, `createdAt`, and `updatedAt` are generated by
        the server. Returns the created task.
      inputSchema:
        type: object
        properties:
          creator:
            anyOf:
              - type: string
                maxLength: 255
              - type: "null"
            title: Creator
            description: Email address of the person who created the task.
            example: john.doe@example.com
          assignee:
            anyOf:
              - type: string
                maxLength: 255
              - type: "null"
            title: Assignee
            description: Email address of the person assigned to work on this task.
            example: jane.smith@example.com
          status: *a1
          targetDate:
            anyOf:
              - type: string
                format: date-time
              - type: "null"
            title: Targetdate
            description: Target completion date and time in ISO 8601 format (UTC). Soft
              deadline.
            example: 2026-06-30T17:00:00Z
          description:
            type: string
            maxLength: 5000
            minLength: 1
            title: Description
            description: Detailed description of what needs to be done.
            example: Implement new feature X
          comment:
            anyOf:
              - type: string
                maxLength: 5000
              - type: "null"
            title: Comment
            description: Additional notes, comments, or context about the task.
            example: High priority - needed for next release
        required:
          - description
      title: Create a new task
      x-api-binding:
        operationPath: /tasks
        operationMethod: POST
        api:
          $path: ./task-management-api-spec.yml
    - name: getTaskById
      description: Retrieves a single task by its unique identifier (UUID). Returns
        the complete task object including all fields and timestamps.
      inputSchema:
        type: object
        properties:
          taskId:
            description: taskId parameter
            x-parameter-location: path
            type: string
            format: uuid
            title: Taskid
        required:
          - taskId
      title: Get a task by ID
      x-api-binding:
        operationPath: /tasks/{taskId}
        operationMethod: GET
        api:
          $path: ./task-management-api-spec.yml
    - name: updateTask
      description: Updates an existing task. All fields are optional; only the fields
        provided are modified. `id`, `creator`, `createdAt`, and `updatedAt`
        cannot be modified. Returns the updated task.
      inputSchema:
        type: object
        properties:
          taskId:
            description: taskId parameter
            x-parameter-location: path
            type: string
            format: uuid
            title: Taskid
          creator:
            anyOf:
              - type: string
                maxLength: 255
              - type: "null"
            title: Creator
            description: Email address of the person who created the task.
          assignee:
            anyOf:
              - type: string
                maxLength: 255
              - type: "null"
            title: Assignee
            description: Email address of the person assigned to work on this task.
          status:
            anyOf:
              - *a1
              - type: "null"
            description: >-
              Current workflow status of the task, representing its position in
              the workflow lifecycle:

              - todo: planned but not yet started

              - inprogress: actively being worked on

              - blocked: cannot proceed due to dependencies or issues

              - done: completed successfully

              - cancelled: cancelled and will not be completed
          targetDate:
            anyOf:
              - type: string
                format: date-time
              - type: "null"
            title: Targetdate
            description: Target completion date and time in ISO 8601 format (UTC). Soft
              deadline.
          description:
            anyOf:
              - type: string
                maxLength: 5000
                minLength: 1
              - type: "null"
            title: Description
            description: Detailed description of what needs to be done.
          comment:
            anyOf:
              - type: string
                maxLength: 5000
              - type: "null"
            title: Comment
            description: Additional notes, comments, or context about the task.
        required:
          - taskId
      title: Update a task
      x-api-binding:
        operationPath: /tasks/{taskId}
        operationMethod: PUT
        api:
          $path: ./task-management-api-spec.yml
    - name: deleteTask
      description: Permanently deletes a task by its unique identifier (UUID). This
        operation cannot be undone and returns no content on success.
      inputSchema:
        type: object
        properties:
          taskId:
            description: taskId parameter
            x-parameter-location: path
            type: string
            format: uuid
            title: Taskid
        required:
          - taskId
      title: Delete a task
      x-api-binding:
        operationPath: /tasks/{taskId}
        operationMethod: DELETE
        api:
          $path: ./task-management-api-spec.yml
